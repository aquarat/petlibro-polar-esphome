select:
  - platform: template
    id: compartments_select
    name: "Compartments"
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["3", "6", "9", "12"]
    initial_option: "${compartments_default}"
    on_value:
      - lambda: |-
          static const uint8_t N[] = {3, 6, 9, 12};
          if (i < 4) id(tray).change_compartments(N[i]);
          // Keep "Filled compartments" within the compartment count (it was shown as 12 with 3).
          if (i < 4 && !std::isnan(id(filled_compartments).state) && id(filled_compartments).state > N[i]) {
            auto call = id(filled_compartments).make_call();
            call.set_value(N[i]);
            call.perform();
          }
  - platform: template
    id: feed_mode
    name: "Feed mode"
    optimistic: true
    restore_value: true
    options: ["rotate_and_open", "lid_only", "serve_and_return", "serve_on_demand"]  # new options go last: the index is persisted
    initial_option: "rotate_and_open"
  - platform: template
    id: serve_choice
    name: "Serve compartment choice"
    icon: mdi:swap-horizontal
    optimistic: true
    restore_value: true
    options: ["alternate", "first storage only (2)", "last storage only (3)"]
    initial_option: "alternate"

polar_tray:
  id: tray
  motor_pin_a: {aw9523b: aw, number: 5, mode: {output: true}}   # P0_5
  motor_pin_b: {aw9523b: aw, number: 6, mode: {output: true}}   # P0_6
  gate_pin:
    number: GPIO10
    mode: {input: true, pullup: true}
    allow_other_uses: true
  compartments: ${compartments_default}
  current_pin: GPIO5
  current_sensing: true
  stall_threshold: 400
  stall_samples: 6
  stall_retries: 3
  edge_timeout: 60s
  max_move_time: 90s
  gate_ignore: 500ms
  gate_debounce: 10ms        # OURS level-stable filter
  home_width_ratio: 2.0      # OURS: widest mark >= 2 x runner-up
  max_invalid_samples: 20    # OURS: 10 s without a valid ADC2 sample while moving -> fault
  power_switches: [en_p04, en_p07]
  position:
    name: "Tray position"
  target:
    name: "Tray target"
  mark_interval:
    name: "Tray mark interval"
  pulse_width:
    name: "Tray mark width"
  motor_current:
    name: "Tray motor current (ADC2 raw)"
  adc_invalid:
    name: "Tray ADC2 invalid samples (last move)"
  state_text:
    name: "Tray state"
  homing_state:
    name: "Tray homing"
  fault:
    name: "Tray fault"
  moving:
    name: "Tray moving"
  homed:
    name: "Tray homed"

polar_lid:
  id: lid
  close_pin: {aw9523b: aw, number: 15, mode: {output: true}}   # P1_7
  open_pin: {aw9523b: aw, number: 14, mode: {output: true}}    # P1_6
  lid_sensor: lid_sensor
  # Level of GPIO19 at an end stop. Stock code implies high; CONFIRM in test step 4 before any feed test.
  sensor_end_level: true
  min_travel: 1000ms         # OURS: sensor not accepted before 1 s of travel (stock: from t = 0)
  close_stall_samples: 2     # OURS anti-pinch: 2 x 100 ms over threshold while closing -> reopen at once
  close_sample_interval: 100ms
  inrush_blanking: 300ms
  pet_sensor: pet_present
  current_sensor: lid_current_adc
  stall_threshold: 0.400
  stall_samples: 6
  stall_retries: 3
  max_move_time: 60s
  check_signal_time: 5s
  nocheck_signal_time: 10s
  run_on: 1000ms
  power_switches: [en_p04, en_p07]
  state_text:
    name: "Lid state"
  fault:
    name: "Lid fault"
  closed:
    name: "Lid closed"
  motor_current:
    name: "Lid motor current"

polar_feeder:
  id: feeder
  tray: tray
  lid: lid
  time_id: ha_time
  pet_sensor: pet_present
  temperature: food_temp
  ir_emitter: ir_tx
  mode_select: feed_mode
  open_minutes: lid_open_minutes
  lead_minutes: lead_minutes
  filled_compartments: filled_compartments
  power_switches: [en_p04, en_p07]
  ir_settle: 1s
  boot_grace: 60s
  serve:
    enabled: serve_enabled
    start: serve_start
    interval: serve_interval
    compartment_choice: serve_choice
    no_show_minutes: serve_no_show
    pet_gone_minutes: serve_pet_gone
    max_open_minutes: serve_max_open
    rest_compartment: 1
    ir_settle: 3s
    on_demand_enabled: on_demand_enabled
    on_demand_min_open_minutes: on_demand_min_open
    on_demand_cooldown_minutes: on_demand_cooldown
    on_demand_hold: 300ms      # real breaks seen on hardware: 0.6 s and up
    on_demand_rearm: 3s
  meals:
    - {time: meal1_time, enabled: meal1_enabled, open_minutes: meal1_open}
    - {time: meal2_time, enabled: meal2_enabled, open_minutes: meal2_open}
    - {time: meal3_time, enabled: meal3_enabled, open_minutes: meal3_open}
    - {time: meal4_time, enabled: meal4_enabled, open_minutes: meal4_open}
    - {time: meal5_time, enabled: meal5_enabled, open_minutes: meal5_open}
    - {time: meal6_time, enabled: meal6_enabled, open_minutes: meal6_open}
    - {time: meal7_time, enabled: meal7_enabled, open_minutes: meal7_open}
    - {time: meal8_time, enabled: meal8_enabled, open_minutes: meal8_open}
    - {time: meal9_time, enabled: meal9_enabled, open_minutes: meal9_open}
    - {time: meal10_time, enabled: meal10_enabled, open_minutes: meal10_open}
    - {time: meal11_time, enabled: meal11_enabled, open_minutes: meal11_open}
    - {time: meal12_time, enabled: meal12_enabled, open_minutes: meal12_open}
  state_text:
    name: "Feeder state"
  last_event:
    name: "Feeder last event"
  next_meal:
    name: "Next meal"
  next_compartment:
    name: "Next compartment"
  empty:
    name: "Run empty"
  feeding:
    name: "Feeding"
  thaw:
    name: "Thaw latch"
  anti_pinch:
    name: "Lid anti-pinch tripped"
  # Stock sends 0xEF when a feed job is accepted (Feed_Handle @0x4200ae46), probably WTN6 "volume max" [I].
  # OURS: not sent; the "Sound volume" byte goes before every play instead.
  on_lid_opened:
    # Stock: sound 1 at lid open (FEED_PLAN_openDoorHandle @0x4200945e), then the SMART ringer.
    # OURS: only for a meal or Feed now (not "Open lid"), only with "Call the pet at meals" on.
    - if:
        condition:
          lambda: 'return id(feeder).is_serving() && !id(feeder).is_beam_serve();'
        then:
          - polar_sound.call_start: {id: snd, meal: true}
  on_feed_end:
    - polar_sound.call_stop: snd   # stock rings only in FEED_PLAN_feedOngoingHandle @0x4200a356

polar_sound:
  id: snd
  pin: GPIO6                 # BSP_aduioInit @0x4200d738: output, idle high
  time_id: ha_time
  enable: sound_enabled
  volume: sound_volume
  volume_before_play: true
  quiet_enable: sound_quiet
  quiet_start: quiet_start
  quiet_end: quiet_end
  pet_sensor: pet_present
  call_enable: call_enabled
  call_repeats: call_repeats
  call_interval: call_interval
  call_stop_on_pet: call_stop_on_pet
  call_default: 1
  sounds:
    1: "meal call (stock)"
  listed_indices: 16
  play_select:
    name: "Play sound"
  call_sound:
    name: "Call sound"
    entity_category: config
  status:
    name: "Sound status"

polar_cooling:
  id: cooling
  peltier: peltier
  temperature: food_temp
  on_battery: on_battery
  enable: cooling_enabled
  thaw_rule: thaw_rule
  feeder: feeder
  setpoint: cool_setpoint
  hysteresis: cool_hysteresis
  max_on_minutes: cool_max_on
  allowed: ${cooling_allowed}
  power_switches: [en_p04, en_p07]
  assert_power_switches: ${cooling_asserts_enables}
  interval: 5min
  min_off_time: 60s
  duty:
    name: "Peltier duty (1 h)"
  since_off:
    name: "Peltier time since off"
  state_text:
    name: "Cooling state"

script:
  - id: stop_all_user        # OURS: a person pressed stop, so the beam must not start the motors again
    mode: restart
    then:
      - switch.turn_off: on_demand_enabled
      - switch.turn_off: cooling_enabled
      - script.execute: stop_all
  - id: stop_all             # also run by OTA, low battery and expander recovery: must not change saved settings
    mode: restart
    then:
      - logger.log: {format: "STOP ALL: brake motors, cancel feed, Peltier off", level: WARN}
      - polar_feeder.cancel: feeder
      - polar_tray.stop: tray
      - polar_lid.stop: lid
      - lambda: 'id(cooling).pause();'
      - polar_sound.call_stop: snd
  - id: button_hold
    mode: restart
    then:
      # Stock KeyRestore_TimerCallback @0x4201d42e: 3 s hold = Wi-Fi reset. OURS: 3 s hold = stop all.
      - delay: 3s
      - logger.log: "Button held 3 s"
      - script.execute: stop_all_user

button:
  - platform: template
    name: "Stop all"
    icon: mdi:stop-circle
    on_press:
      - script.execute: stop_all_user
  - platform: template
    name: "Feed now"
    icon: mdi:food
    on_press:
      - polar_feeder.feed_now: {id: feeder}
  - platform: template
    name: "Open lid"
    icon: mdi:arrow-up-box
    on_press:
      - polar_feeder.open_lid: feeder
  - platform: template
    name: "Close lid"
    icon: mdi:arrow-down-box
    on_press:
      - polar_feeder.close_now: feeder
  - platform: template
    name: "Refilled"
    icon: mdi:refresh
    on_press:
      - polar_feeder.refilled: feeder
  - platform: template
    name: "Tray home"
    on_press:
      - polar_tray.home: tray
  - platform: template
    name: "Tray step"
    on_press:
      - polar_tray.step: tray
  - platform: template
    name: "Clear faults"
    entity_category: config
    on_press:
      - polar_tray.clear_fault: tray
      - polar_lid.clear_fault: lid
  # --- test aids (docs/esphome-firmware.md test plan); no pet check, no feed logic
  - platform: template
    name: "Test: tray jog forward 0.5 s"
    entity_category: diagnostic
    on_press:
      - polar_tray.jog: {id: tray, forward: true, duration: 500ms}
  - platform: template
    name: "Test: lid jog open 0.3 s"
    entity_category: diagnostic
    on_press:
      - polar_lid.jog: {id: lid, open: true, duration: 300ms}
  - platform: template
    name: "Test: lid jog close 0.3 s"
    entity_category: diagnostic
    on_press:
      - polar_lid.jog: {id: lid, open: false, duration: 300ms}
  - platform: template
    name: "Test: lid open (manual profile)"
    entity_category: diagnostic
    on_press:
      - polar_lid.open: {id: lid, profile: manual}
  - platform: template
    name: "Test: lid close (manual profile, no pet check)"
    entity_category: diagnostic
    on_press:
      - polar_lid.close: {id: lid, profile: manual}
  - platform: template
    name: "Sound: play meal call (0x01)"
    icon: mdi:bullhorn
    on_press:
      - polar_sound.play: {id: snd, index: 1, force: true}
  - platform: template
    name: "Sound: call the pet now"
    icon: mdi:bullhorn-variant
    on_press:
      - polar_sound.call_start: snd
  - platform: template
    name: "Sound stop"
    icon: mdi:volume-off
    on_press:
      - polar_sound.stop: snd
  - platform: template
    name: "Test: sound send volume now"
    entity_category: diagnostic
    on_press:
      - polar_sound.set_volume:
          id: snd
          level: !lambda 'return (int) id(sound_volume).state;'
  - platform: template
    name: "Test: sound send 0xEF (stock feed-start byte)"
    entity_category: diagnostic
    on_press:
      - polar_sound.send: {id: snd, code: 0xEF}
  - platform: template
    name: "Test: sound loop current (0xF2)"
    entity_category: diagnostic
    on_press:
      - polar_sound.loop: snd
  - platform: restart
    name: "Restart"

binary_sensor:
  - platform: template
    name: "Peltier"
    icon: mdi:snowflake
    lambda: 'return id(peltier).state;'
  - platform: gpio
    id: on_battery
    name: "On battery"
    pin: GPIO0           # 0 = DC, 1 = battery (Power_Handle @0x4200c948)
    on_release:          # DC back: release the low-battery lockout
      - lambda: |-
          id(low_batt_count) = 0;
          if (id(low_batt_lockout)) {
            id(low_batt_lockout) = false;
            if (id(hw_rev_ok)) {
              id(tray).set_inhibit(false, "DC power back");
              id(lid).set_inhibit(false, "DC power back");
            }
          }
  - platform: gpio
    id: tray_gate
    name: "Tray gate (GPIO10)"
    entity_category: diagnostic
    use_interrupt: false     # the tray component owns the GPIO10 interrupt (ESPHome also forces polling)
    pin:
      number: GPIO10
      mode: {input: true, pullup: true}
      allow_other_uses: true
  - platform: gpio
    id: lid_sensor
    name: "Lid sensor (GPIO19)"
    entity_category: diagnostic
    pin: GPIO19
  - platform: gpio
    id: pet_present
    name: "Pet present (IR)"
    device_class: occupancy
    pin: GPIO20          # 1 = something in front (Infrared_Handle @0x4200c604)
  - platform: gpio
    id: button_key
    name: "Button"
    pin:
      number: GPIO18
      inverted: true     # active low (Key_init @0x4200d10c)
    filters:
      - delayed_on_off: 50ms
    on_press:
      - script.execute: button_hold
    on_release:
      - script.stop: button_hold

sensor:
  - platform: adc
    id: ntc_v
    pin: GPIO1
    attenuation: 12db    # Adc_init @0x4200d26e: 11 dB
    samples: 10          # Read_Ntc_Temp @0x4200d488: mean of 10 samples
    update_interval: 10s
    internal: true
  - platform: resistance
    id: ntc_r
    sensor: ntc_v
    configuration: DOWNSTREAM
    resistor: 10kOhm     # 10k pull-up to 3.3 V
    reference_voltage: 3.3V
    internal: true
  - platform: ntc
    id: food_temp
    sensor: ntc_r
    name: "Food temperature"
    calibration: {b_constant: 3950, reference_temperature: 25C, reference_resistance: 10kOhm}
    filters:
      - offset: 0.5      # stock +0.5 C (Read_Ntc_Temp @0x4200d488)
  - platform: adc
    id: lid_current_adc  # Read_DoorMotorAdc @0x4200d402: ADC1 ch3, calibrated mV; sampled by polar_lid while moving
    pin: GPIO3
    attenuation: 12db
    update_interval: never
    internal: true
  - platform: adc
    id: bat_raw          # ADC1 ch4, x2 divider (FUN_ram_4200d360)
    pin: GPIO4
    attenuation: 12db
    update_interval: 1s
    internal: true
    filters:
      - multiply: 2.0
    on_value:
      - lambda: |-
          // FUN_ram_4200c88c: on battery, < 3300 mV for 5 loops (2.5 s) -> brake motors, suspend.
          // OURS: 3 consecutive 1 s samples -> stop all and inhibit motors until DC returns.
          if (id(on_battery).state && x < 3.3f) {
            if (++id(low_batt_count) >= 3 && !id(low_batt_lockout)) {
              id(low_batt_lockout) = true;
              ESP_LOGE("main", "Battery %.2f V < 3.30 V on battery: motors inhibited", x);
              id(stop_all).execute();
              id(tray).set_inhibit(true, "low battery");
              id(lid).set_inhibit(true, "low battery");
            }
          } else {
            id(low_batt_count) = 0;
          }
  - platform: template
    name: "Battery voltage"
    unit_of_measurement: V
    device_class: voltage
    accuracy_decimals: 2
    update_interval: 60s
    lambda: 'return id(bat_raw).state;'
  - platform: template
    name: "Battery level"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    update_interval: 60s
    # Table @0x3c0fa6c0 (FUN_ram_4200c81c): 3300 mV = 0 %, +120 mV per 10 %, 4500 mV = 100 %
    lambda: |-
      float mv = id(bat_raw).state * 1000.0f;
      if (std::isnan(mv)) return NAN;
      return clamp((mv - 3300.0f) / 12.0f, 0.0f, 100.0f);
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: internal_temperature
    name: "ESP temperature"
    entity_category: diagnostic

text_sensor:
  - platform: template
    id: hw_rev
    name: "Hardware revision"
    entity_category: diagnostic
  - platform: debug
    reset_reason:
      name: "Reset reason"

debug:
  update_interval: 60s

interval:
  # Status LEDs, every 500 ms like stock FUN_ram_4200c73a. Stock: error or battery -> P1_0 solid; Wi-Fi not up ->
  # P1_0 blinks 1 s/1 s; otherwise P1_1 by network state (solid = cloud connected). OURS: "cloud" = HA API.
  - interval: 500ms
    then:
      - lambda: |-
          static uint8_t tick = 0;
          tick++;
          const bool blink = (tick / 2) % 2;   // 1 s on / 1 s off
          bool red = false, green = false;
          if (id(leds_enabled).state) {
            const bool fault = id(tray).is_fault() || id(lid).is_fault() || id(low_batt_lockout) || !id(hw_rev_ok);
            if (fault || id(on_battery).state) {
              red = true;
            } else if (!wifi::global_wifi_component->is_connected()) {
              red = blink;
            } else if (!api::global_api_server->is_connected()) {
              green = blink;
            } else {
              green = true;
            }
          }
          if (red) id(led_p10).turn_on(); else id(led_p10).turn_off();
          if (green) id(led_p11).turn_on(); else id(led_p11).turn_off();
  # Stock CTRL_THREAD_batteryModeHandle @0x4200e4fc: on battery P0_4/P0_7 are on only while a motor moves.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(on_battery).state && !id(tray).is_busy() && !id(lid).is_busy() && !id(feeder).is_feeding();'
          then:
            - switch.turn_off: en_p04
            - switch.turn_off: en_p07
  # Cooldown test log (docs/esphome-firmware.md test 9): fan state must be noted by the observer.
  - interval: 30s
    then:
      - if:
          condition:
            switch.is_on: cooling_enabled
          then:
            - lambda: |-
                ESP_LOGI("cooldown", "T=%.2f C setpoint=%.1f peltier=%s duty1h=%.1f%%", id(food_temp).state,
                         id(cool_setpoint).state, id(peltier).state ? "ON" : "off", id(cooling).get_duty());
