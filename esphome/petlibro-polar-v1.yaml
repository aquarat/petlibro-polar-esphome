# Petlibro Polar PLAF109 wet-food feeder: ESPHome re-implementation of the stock app AF109 2.0.38, v1.
# Board "PLAF109 MainBoard V1.0 2025.07.22", ESP32-C3-WROOM-02U (4 MB), hardware revision 5.2.0.
# Design, entities, test plan: docs/esphome-firmware.md. Pin map and sources: docs/hardware.md.
# Every stock constant is cited as <function>@<address> from analysis/static/README.md (S) or the
# emulation notes analysis/emulation/README.md (E). "OURS" marks behaviour that is not from stock.
#
# SAFETY DEFAULTS (development):
#   - At boot the lid closes (anti-pinch) and the tray homes to compartment 1, as stock (home_on_boot).
#   - Cooling is disabled at compile time (cooling_allowed) AND by a runtime switch that is off at boot:
#     the fan wiring is UNKNOWN and UNTESTED. Never run the Peltier without confirming the fan runs.
#   - Every motor move has a hard timeout and ends braked (H-bridge 1,1).
#   - Hold the button (GPIO18) 3 s, or press "Stop all", to brake both motors and disable cooling.
#
# Installed into the stock partition table under the stock IDF v4.4.6 bootloader (no OTA rollback).

substitutions:
  device_name: petlibro-polar
  friendly_name: "Petlibro Polar"
  # OURS (stock = true): close the lid and home the tray at boot.
  home_on_boot: "true"
  # Stock AllDet_init @0x4200ce24 sets P0_4/P0_7 = 1 at boot on DC. What they power is unknown.
  # The tray/lid controllers switch them on before every move anyway.
  enables_on_boot: "false"
  # Compile-time cooling gate. Keep "false" until the fan wiring is confirmed (docs/esphome-firmware.md, test 8).
  cooling_allowed: "true"   # fan verified 2026-10-30: switched with P1_4 in hardware
  # Default tray: 3 (stock). 6, 9, 12 are EXPERIMENTAL timed sub-steps; also selectable at runtime.
  compartments_default: "3"
  # Cooling switches P0_4/P0_7 on before the Peltier (stock DC state). "false" only for the fan-wiring test.
  cooling_asserts_enables: "true"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      # AW9523B reset (200 ms) + init run asynchronously in the hub; wait for it.
      - wait_until:
          condition:
            lambda: 'return id(aw).is_ready() || id(aw).is_failed();'
          timeout: 3s
      - lambda: |-
          if (!id(aw).is_ready()) {
            id(hw_rev).publish_state("AW9523B not found");
            id(hw_rev_ok) = false;
          } else {
            // GetHardwareVersion @0x4200d930: P0 bits[1:0]: 0 -> 5.0.0, 2 -> 5.1.0, 1/3 -> 5.2.0
            int p0 = id(aw).read_port(0);
            int r = p0 < 0 ? -1 : (p0 & 0x03);
            const char *rev = r < 0 ? "read failed" : r == 0 ? "5.0.0" : r == 2 ? "5.1.0" : "5.2.0";
            id(hw_rev).publish_state(str_sprintf("%s (ID 0x%02X, P0 0x%02X)", rev, id(aw).get_chip_id(), p0 & 0xFF));
            // Only the 5.2.0 homing (widest mark, falling edge) is implemented.
            id(hw_rev_ok) = (r == 1 || r == 3);
          }
          if (!id(hw_rev_ok)) {
            ESP_LOGE("main", "Expander missing or hardware revision is not 5.2.0: motors inhibited");
            id(tray).set_inhibit(true, "hardware revision");
            id(lid).set_inhibit(true, "hardware revision");
          }
      - if:
          condition:
            lambda: 'return ${enables_on_boot} && !id(on_battery).state;'
          then:
            - switch.turn_on: en_p04
            - switch.turn_on: en_p07
      - if:
          condition:
            lambda: 'return ${home_on_boot} && id(hw_rev_ok);'
          then:
            # Stock DoorMotor_Reset_ThreadHandle @0x4200ec58: close the lid first, then (HW 5.2.0) home the tray.
            # OURS: the close goes through the feeder's anti-pinch path (IR on, enables on, 10 s clear, pet
            # check, stall reopen), and the tray homes only if the lid really closed.
            - logger.log: "home_on_boot: closing lid (anti-pinch), then homing tray"
            - polar_feeder.boot_close: feeder
            - wait_until:
                condition:
                  lambda: 'return !id(feeder).is_feeding();'
                timeout: 5min
            - if:
                condition:
                  lambda: 'return id(lid).is_closed();'
                then:
                  - polar_tray.home:
                else:
                  - logger.log: {format: "home_on_boot: lid not closed, tray NOT homed", level: ERROR}

esp32:
  variant: esp32c3
  board: esp32-c3-devkitm-1
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [aw9523b, polar_tray, polar_lid, polar_feeder, polar_cooling, polar_sound]

logger:
  level: DEBUG
  hardware_uart: UART0   # ISP header (GPIO21 TX), 115200. GPIO18/19 are I/O, so no USB-Serial-JTAG.
  baud_rate: 115200

api:
  encryption:
    key: !secret petlibro_polar_api_key
  actions:
    - action: stop_all
      then:
        - script.execute: stop_all_user
    - action: tray_home
      then:
        - polar_tray.home: tray
    - action: tray_step
      then:
        - polar_tray.step: tray
    - action: tray_go_to
      variables:
        compartment: int
      then:
        - polar_tray.go_to:
            id: tray
            compartment: !lambda 'return compartment;'
    - action: feed_now
      variables:
        minutes: int   # -1 = global lid-open time, 0 = until close_lid
      then:
        - polar_feeder.feed_now:
            id: feeder
            minutes: !lambda 'return minutes;'
    - action: open_lid
      then:
        - polar_feeder.open_lid: feeder
    # Seam for an external controller (e.g. a future load-cell scale): end the meal early, with anti-pinch.
    - action: close_lid
      then:
        - polar_feeder.close_now: feeder
    - action: refilled
      then:
        - polar_feeder.refilled: feeder
    - action: set_meal
      variables:
        slot: int      # 1..12
        hour: int
        minute: int
        enabled: bool
      then:
        - lambda: |-
            datetime::TimeEntity *t[] = {id(meal1_time), id(meal2_time), id(meal3_time), id(meal4_time), id(meal5_time), id(meal6_time), id(meal7_time), id(meal8_time), id(meal9_time), id(meal10_time), id(meal11_time), id(meal12_time)};
            switch_::Switch *e[] = {id(meal1_enabled), id(meal2_enabled), id(meal3_enabled), id(meal4_enabled), id(meal5_enabled), id(meal6_enabled), id(meal7_enabled), id(meal8_enabled), id(meal9_enabled), id(meal10_enabled), id(meal11_enabled), id(meal12_enabled)};
            if (slot < 1 || slot > 12 || hour < 0 || hour > 23 || minute < 0 || minute > 59) {
              ESP_LOGW("main", "set_meal: invalid arguments");
              return;
            }
            auto call = t[slot - 1]->make_call();
            call.set_time(hour, minute, 0);
            call.perform();
            e[slot - 1]->control(enabled);
    # Sound (polar_sound, UNTESTED). index 0..223 (0x00..0xDF); force = ignore quiet hours.
    - action: play_sound
      variables:
        index: int
        force: bool
      then:
        - polar_sound.play:
            id: snd
            index: !lambda 'return index;'
            force: !lambda 'return force;'
    - action: sound_volume
      variables:
        level: int     # 0..15 -> 0xE0 + level (WTN6 [I]); sent now and before every play
      then:
        - polar_sound.set_volume:
            id: snd
            level: !lambda 'return level;'
    - action: sound_stop
      then:
        - polar_sound.stop: snd
    - action: sound_send   # raw byte 0..255, test use (0x00..0xDF obey the sound switch / quiet hours)
      variables:
        code: int
      then:
        - polar_sound.send:
            id: snd
            code: !lambda 'return code;'
    - action: call_pet     # manual "call the pet" with the configured sound and repeats
      then:
        - polar_sound.call_start: snd

ota:
  - platform: esphome
    password: !secret ota_password
    # The OTA receive loop blocks every other loop() (no timeouts run): brake and cool off first.
    on_begin:
      - script.execute: stop_all
    on_error:
      - logger.log: {format: "OTA failed: motors stopped (stop all ran at OTA start)", level: ERROR}

safe_mode:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "${device_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  auth:
    type: digest
    username: admin
    password: !secret ota_password

time:
  - platform: homeassistant
    id: ha_time
  - platform: sntp
    id: sntp_time

i2c:
  id: bus0
  sda: GPIO7   # AW9523B_i2cInit @0x4200d9c8: I2C0 SDA=7, SCL=8, 100 kHz, internal pull-ups
  scl:
    number: GPIO8
    ignore_strapping_warning: true
  frequency: 100kHz
  scan: true

aw9523b:
  - id: aw
    address: 0x58
    reset_pin:
      number: GPIO9            # RSTN, low 200 ms then high (stock); also the download-mode strap
      ignore_strapping_warning: true
    reset_duration: 200ms
    # Both H-bridges braked from the first output write: P0_5, P0_6 (tray), P1_6, P1_7 (lid) = 1
    # (Motor_init @0x4200d1a2, Door_Motor_init @0x4200d1e8).
    initial_high_pins: [5, 6, 14, 15]
    input_pins: [0, 1]         # HW revision straps (0x04 = 0x03)
    port0_push_pull: true      # GCR 0x11 = 0x10
    # OURS: on shutdown/recovery force brakes (5, 6, 14, 15 high) and Peltier P1_4 low.
    fail_safe_pins: [5, 6, 12, 14, 15]
    # OURS: read back outputs/direction/GCR; on mismatch or I2C failures pulse RSTN and re-init.
    verify_interval: 1s
    on_recover:
      - lambda: |-
          ESP_LOGE("main", "AW9523B recovery (%s): faulting both motors", reason.c_str());
          id(tray).force_fault("expander reset");
          id(lid).force_fault("expander reset");
      - script.execute: stop_all

globals:
  - id: hw_rev_ok
    type: bool
    initial_value: "false"
  - id: low_batt_count
    type: int
    initial_value: "0"
  - id: low_batt_lockout
    type: bool
    initial_value: "false"

output:
  - platform: gpio
    id: led_p10              # P1_0: fault / alarm LED (AlarmLed_init @0x4200d162, E 5.6)
    pin: {aw9523b: aw, number: 8, mode: {output: true}}
  - platform: gpio
    id: led_p11              # P1_1: status LED
    pin: {aw9523b: aw, number: 9, mode: {output: true}}
  - platform: ledc
    id: ir_tx                # AllDet_init: LEDC ch0 timer0, 38 kHz, duty 127/256 during feeds
    pin:
      number: GPIO2
      ignore_strapping_warning: true
    frequency: 38000Hz

switch:
  - platform: template
    id: on_demand_enabled      # OURS: serve_on_demand beam trigger; a user Stop all turns it off
    name: "On-demand enabled"
    icon: mdi:cat
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: serve_enabled          # OURS: serve_and_return interval schedule (only acts in that feed mode)
    name: "Serve schedule enabled"
    icon: mdi:calendar-clock
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    id: en_p04
    name: "Power enable P0_4"
    entity_category: config
    restore_mode: ALWAYS_OFF
    pin: {aw9523b: aw, number: 4, mode: {output: true}}
  - platform: gpio
    id: en_p07
    name: "Power enable P0_7"
    entity_category: config
    restore_mode: ALWAYS_OFF
    pin: {aw9523b: aw, number: 7, mode: {output: true}}
  - platform: gpio
    id: peltier              # P1_4 "GPIO_PTC_ON" (CTRL_THREAD_coolHanlde @0x4200e6f6).
    internal: true           # only polar_cooling drives it; HA sees the "Peltier" binary sensor
    restore_mode: ALWAYS_OFF
    pin: {aw9523b: aw, number: 12, mode: {output: true}}
  - platform: template
    id: cooling_enabled
    name: "Cooling enabled (UNTESTED)"
    icon: mdi:snowflake
    optimistic: true
    # Was ALWAYS_OFF (fan wiring unknown). Fan confirmed switched with the Peltier (docs/hardware.md) and 12 h of
    # runs without trouble; serve_and_return needs cooling to survive reboots and power cuts.
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: 'id(cooling).evaluate_now();'
  - platform: template
    id: thaw_rule
    name: "Cooling thaw rule (stock)"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: leds_enabled
    name: "LEDs enabled"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: sound_enabled        # master gate (stock soundSwitch, FUN_ram_4200c276); blocks every sound byte
    name: "Sound enabled (UNTESTED)"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: sound_quiet          # OURS: no automatic sounds between the quiet start and end times
    name: "Sound quiet hours"
    icon: mdi:sleep
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: call_enabled         # stock: sound 1 at lid open (FEED_PLAN_openDoorHandle @0x4200945e). OURS: off by default
    name: "Call the pet at meals"
    icon: mdi:bullhorn
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: call_stop_on_pet     # stock ringerMode SMART: a pet on GPIO20 ends the ringer (FUN_ram_4200a23e)
    name: "Call stops when pet seen"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: meal1_enabled
    name: "Meal 1 enabled"
    icon: mdi:food
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
